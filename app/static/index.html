<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Senior Heat Voice Lab Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-soft: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #374151;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --unknown: #a78bfa;
      --blue: #38bdf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 45%);
      color: var(--text);
    }

    header {
      padding: 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.85);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    main {
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .stats-grid {
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      margin-bottom: 20px;
    }

    .content-grid {
      grid-template-columns: 340px 1fr;
      align-items: start;
    }

    @media (max-width: 900px) {
      .content-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.22);
    }

    .stat {
      background: rgba(17, 24, 39, 0.78);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .stat-value {
      margin-top: 8px;
      font-size: 28px;
      font-weight: 700;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 12px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 18px;
    }

    button {
      border: 1px solid var(--border);
      background: var(--panel-soft);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }

    button:hover {
      background: #334155;
    }

    .senior-card {
      border: 1px solid var(--border);
      background: rgba(31, 41, 55, 0.6);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .senior-card:hover {
      border-color: var(--blue);
    }

    .senior-card.active {
      border-color: var(--blue);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
    }

    .senior-name {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .small {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 700;
      margin-top: 8px;
      border: 1px solid var(--border);
    }

    .risk-green {
      color: var(--green);
      border-color: rgba(34, 197, 94, 0.4);
      background: rgba(34, 197, 94, 0.08);
    }

    .risk-yellow {
      color: var(--yellow);
      border-color: rgba(234, 179, 8, 0.4);
      background: rgba(234, 179, 8, 0.08);
    }

    .risk-red {
      color: var(--red);
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.08);
    }

    .risk-unknown {
      color: var(--unknown);
      border-color: rgba(167, 139, 250, 0.4);
      background: rgba(167, 139, 250, 0.08);
    }

    .risk-neutral {
      color: var(--muted);
    }

    .two-column {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    @media (max-width: 900px) {
      .two-column {
        grid-template-columns: 1fr;
      }
    }

    .detail-row {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(55, 65, 81, 0.55);
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      color: var(--muted);
      font-size: 13px;
    }

    .detail-value {
      font-size: 14px;
      word-break: break-word;
    }

    .timeline-item {
      border-left: 3px solid var(--border);
      padding: 0 0 16px 14px;
      margin-left: 6px;
      position: relative;
    }

    .timeline-item::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--blue);
      position: absolute;
      left: -6px;
      top: 3px;
    }

    .timeline-title {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .timeline-meta {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .transcript {
      color: #d1d5db;
      background: rgba(15, 23, 42, 0.65);
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(55, 65, 81, 0.65);
      font-size: 14px;
      line-height: 1.45;
    }

    .alert-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      background: rgba(31, 41, 55, 0.48);
    }

    .empty {
      color: var(--muted);
      padding: 16px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      text-align: center;
    }

    .error {
      color: #fecaca;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Senior Heat Voice Lab</h1>
    <div class="subtitle">Local dashboard for check-ins, HeatRisk, alerts, and baseline comparison.</div>
  </header>

  <main>
    <div id="error" class="error"></div>

    <section class="grid stats-grid" id="stats"></section>

    <section class="grid content-grid">
      <aside class="card">
        <div class="section-title">
          <h2>Seniors</h2>
          <button onclick="loadDashboard()">Refresh</button>
        </div>
        <div id="seniorList"></div>
      </aside>

      <div class="grid">
        <section class="card">
          <div class="section-title">
            <h2>Senior Detail</h2>
            <span class="small" id="selectedSeniorLabel">No senior selected</span>
          </div>
          <div id="seniorDetail" class="empty">Select a senior to view details.</div>
        </section>

        <section class="two-column">
          <div class="card">
            <div class="section-title">
              <h2>Recent Alerts</h2>
            </div>
            <div id="alerts"></div>
          </div>

          <div class="card">
            <div class="section-title">
              <h2>Timeline</h2>
            </div>
            <div id="timeline"></div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script>
    let selectedSeniorId = null;

    function riskClass(value) {
      const normalized = String(value || "").toUpperCase();

      if (normalized === "GREEN") return "risk-green";
      if (normalized === "YELLOW") return "risk-yellow";
      if (normalized === "RED") return "risk-red";
      if (normalized === "UNKNOWN") return "risk-unknown";

      return "risk-neutral";
    }

    function formatDate(value) {
      if (!value) return "Not available";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return value;
      }

      return date.toLocaleString();
    }

    function showError(message) {
      const box = document.getElementById("error");
      box.textContent = message;
      box.style.display = "block";
    }

    function clearError() {
      const box = document.getElementById("error");
      box.textContent = "";
      box.style.display = "none";
    }

    async function api(path) {
      const response = await fetch(path);

      if (!response.ok) {
        throw new Error(`${path} failed with HTTP ${response.status}`);
      }

      return response.json();
    }

    function renderStats(summary) {
      const totals = summary.totals || {};
      const riskCounts = summary.risk_counts || {};

      const stats = [
        ["Active Seniors", totals.active_seniors ?? 0],
        ["Check-ins", totals.check_ins ?? 0],
        ["Alerts", totals.caregiver_alerts ?? 0],
        ["Baselines", totals.baseline_samples ?? 0],
        ["Comparisons", totals.baseline_comparisons ?? 0],
        ["Yellow", riskCounts.YELLOW ?? 0],
        ["Red", riskCounts.RED ?? 0],
        ["Unknown", riskCounts.UNKNOWN ?? 0],
      ];

      document.getElementById("stats").innerHTML = stats.map(([label, value]) => `
        <div class="stat">
          <div class="stat-label">${label}</div>
          <div class="stat-value">${value}</div>
        </div>
      `).join("");
    }

    function renderSeniorList(items) {
      const container = document.getElementById("seniorList");

      if (!items.length) {
        container.innerHTML = `<div class="empty">No seniors found.</div>`;
        return;
      }

      container.innerHTML = items.map((item) => {
        const senior = item.senior;
        const latestCheckIn = item.latest_check_in;
        const latestHeat = item.latest_heat_observation;
        const latestComparison = item.latest_baseline_comparison;

        const risk = latestCheckIn?.risk_level || "No check-in";
        const active = selectedSeniorId === senior.id ? "active" : "";

        return `
          <div class="senior-card ${active}" onclick="selectSenior(${senior.id})">
            <div class="senior-name">${senior.name}</div>
            <div class="small">${senior.phone_number}</div>
            <div class="pill ${riskClass(risk)}">${risk}</div>
            <div class="small" style="margin-top: 8px;">
              HeatRisk: ${latestHeat ? `${latestHeat.heat_risk_value} - ${latestHeat.heat_risk_label}` : "Not checked"}
            </div>
            <div class="small">
              Baseline: ${latestComparison ? latestComparison.baseline_deviation_level : "No comparison"}
            </div>
          </div>
        `;
      }).join("");
    }

    function detailRow(label, value) {
      return `
        <div class="detail-row">
          <div class="detail-label">${label}</div>
          <div class="detail-value">${value ?? "Not available"}</div>
        </div>
      `;
    }

    function renderSeniorDetail(data) {
      const senior = data.senior;
      const heat = data.heat_settings;
      const checkIn = data.recent_check_ins?.[0];
      const baseline = data.recent_baselines?.[0];
      const comparison = data.recent_baseline_comparisons?.[0];

      document.getElementById("selectedSeniorLabel").textContent = senior.name;

      document.getElementById("seniorDetail").className = "";
      document.getElementById("seniorDetail").innerHTML = `
        <div class="two-column">
          <div>
            <h3>Profile</h3>
            ${detailRow("Name", senior.name)}
            ${detailRow("Phone", senior.phone_number)}
            ${detailRow("Language", senior.preferred_language)}
            ${detailRow("Active", senior.is_active ? "Yes" : "No")}
            ${detailRow("Caregivers", data.caregivers?.length ?? 0)}
          </div>

          <div>
            <h3>Heat Settings</h3>
            ${detailRow("Enabled", heat?.enabled ? "Yes" : "No")}
            ${detailRow("Location", heat ? `${heat.city || ""}, ${heat.state || ""} ${heat.zip_code || ""}` : "Not configured")}
            ${detailRow("Coordinates", heat ? `${heat.latitude}, ${heat.longitude}` : "Not configured")}
            ${detailRow("Threshold", heat ? `${heat.trigger_threshold}` : "Not configured")}
            ${detailRow("Timezone", heat?.timezone)}
          </div>
        </div>

        <div style="height: 16px;"></div>

        <div class="two-column">
          <div>
            <h3>Latest Check-in</h3>
            ${checkIn ? `
              ${detailRow("Risk", `<span class="pill ${riskClass(checkIn.risk_level)}">${checkIn.risk_level}</span>`)}
              ${detailRow("When", formatDate(checkIn.created_at))}
              ${detailRow("Confidence", checkIn.speech_confidence)}
              <div class="transcript">${checkIn.transcript || "No transcript."}</div>
              <div class="small" style="margin-top: 8px;">${checkIn.caregiver_summary || ""}</div>
            ` : `<div class="empty">No check-ins yet.</div>`}
          </div>

          <div>
            <h3>Baseline Comparison</h3>
            ${comparison ? `
              ${detailRow("Deviation", `<span class="pill ${riskClass(comparison.baseline_deviation_level)}">${comparison.baseline_deviation_level}</span>`)}
              ${detailRow("Word Ratio", comparison.word_count_ratio?.toFixed ? comparison.word_count_ratio.toFixed(2) : comparison.word_count_ratio)}
              ${detailRow("Confidence Delta", comparison.confidence_delta?.toFixed ? comparison.confidence_delta.toFixed(2) : comparison.confidence_delta)}
              ${detailRow("Reasons", comparison.reasons?.join("<br>"))}
            ` : `<div class="empty">No baseline comparison yet.</div>`}

            <h3 style="margin-top: 18px;">Latest Baseline</h3>
            ${baseline ? `
              ${detailRow("Status", baseline.status)}
              ${detailRow("Confidence", baseline.speech_confidence)}
              <div class="transcript">${baseline.transcript || "No transcript."}</div>
            ` : `<div class="empty">No baseline captured yet.</div>`}
          </div>
        </div>
      `;
    }

    function renderAlerts(items) {
      const container = document.getElementById("alerts");

      if (!items.length) {
        container.innerHTML = `<div class="empty">No alerts yet.</div>`;
        return;
      }

      container.innerHTML = items.slice(0, 8).map((alert) => `
        <div class="alert-item">
          <div>
            <span class="pill ${riskClass(alert.risk_level)}">${alert.risk_level}</span>
            <span class="pill">${alert.alert_kind || "alert"}</span>
          </div>
          <div class="timeline-title" style="margin-top: 10px;">${alert.title || "Caregiver alert"}</div>
          <div class="small">${formatDate(alert.created_at)}</div>
          <div class="small" style="margin-top: 8px;">${alert.caregiver_summary || ""}</div>
          <div class="small" style="margin-top: 8px;">Status: ${alert.delivery_status || "unknown"}</div>
        </div>
      `).join("");
    }

    function renderTimeline(items) {
      const container = document.getElementById("timeline");

      if (!items.length) {
        container.innerHTML = `<div class="empty">No timeline items yet.</div>`;
        return;
      }

      container.innerHTML = items.slice(0, 20).map((event) => {
        const data = event.data || {};
        const transcript = data.transcript || data.current_transcript || "";

        return `
          <div class="timeline-item">
            <div class="timeline-title">${event.title}</div>
            <div class="timeline-meta">${event.type} · ${formatDate(event.timestamp)}</div>
            ${transcript ? `<div class="transcript">${transcript}</div>` : ""}
            ${data.reasons ? `<div class="small" style="margin-top: 8px;">${data.reasons.join("<br>")}</div>` : ""}
          </div>
        `;
      }).join("");
    }

    async function selectSenior(seniorId) {
      selectedSeniorId = seniorId;
      clearError();

      try {
        const [seniorDetail, timeline] = await Promise.all([
          api(`/dashboard/seniors/${seniorId}`),
          api(`/dashboard/seniors/${seniorId}/timeline`),
        ]);

        renderSeniorDetail(seniorDetail);
        renderTimeline(timeline.items || []);

        const seniors = await api("/dashboard/seniors");
        renderSeniorList(seniors.items || []);
      } catch (error) {
        showError(error.message);
      }
    }

    async function loadDashboard() {
      clearError();

      try {
        const [summary, seniors, alerts] = await Promise.all([
          api("/dashboard/summary"),
          api("/dashboard/seniors"),
          api("/dashboard/alerts"),
        ]);

        renderStats(summary);
        renderSeniorList(seniors.items || []);
        renderAlerts(alerts.items || []);

        if (!selectedSeniorId && seniors.items?.length) {
          selectedSeniorId = seniors.items[0].senior.id;
        }

        if (selectedSeniorId) {
          await selectSenior(selectedSeniorId);
        }
      } catch (error) {
        showError(error.message);
      }
    }

    loadDashboard();

    setInterval(loadDashboard, 30000);
  </script>
</body>
</html>
