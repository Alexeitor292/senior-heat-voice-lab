name: CI

on:
  push:
    branches:
      - main
      - stabilization/**
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest

    env:
      TWILIO_ACCOUNT_SID: ACtest00000000000000000000000000000
      TWILIO_AUTH_TOKEN: test_auth_token_00000000000000000000
      TWILIO_PHONE_NUMBER: "+15550000000"
      TEST_PHONE_NUMBER: "+15551111111"
      PUBLIC_BASE_URL: https://test.example.com

      DATABASE_URL: sqlite:///./data/ci_test.db
      AUTO_CREATE_DB_TABLES: "false"

      DASHBOARD_AUTH_ENABLED: "true"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-me-local-dev

      TWILIO_SIGNATURE_VALIDATION_ENABLED: "true"

      OPENAI_REALTIME_ENABLED: "false"

      HEAT_RISK_PROVIDER: manual
      MANUAL_HEAT_RISK_VALUE: "2"

      LOG_PII: "false"
      LOG_TRANSCRIPTS: "false"
      LOG_RAW_ANALYSIS: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Alembic migration drift
        run: |
          mkdir -p data
          python -m alembic check

      - name: Apply Alembic migrations to fresh CI database
        run: |
          rm -f data/ci_test.db
          python -m alembic upgrade head

      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      INTERNAL_API_BASE_URL: http://localhost:8000
      API_BASIC_AUTH_USERNAME: admin
      API_BASIC_AUTH_PASSWORD: change-me-local-dev
      NEXT_PUBLIC_ALLOW_MOCK_FALLBACK: "false"
      ENABLE_BACKEND_PROXY_IN_PRODUCTION: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build